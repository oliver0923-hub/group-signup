<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程分組報名</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>課程分組報名</h2>

        <h3>填寫個人資料</h3>

        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名">

        <label for="studentId">學號</label>
        <input type="text" id="studentId" placeholder="請輸入學號">

        <label for="department">系所</label>
        <input type="text" id="department" placeholder="請輸入系所">

        <label for="groupSize">報名人數（最多 10 人）</label>
        <select id="groupSize" onchange="updateFields()">
            <option value="1">1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
            <option value="5">5 人</option>
            <option value="6">6 人</option>
            <option value="7">7 人</option>
            <option value="8">8 人</option>
            <option value="9">9 人</option>
            <option value="10">10 人</option>
        </select>

        <div id="extraMembers"></div>

        <h3>選擇組別</h3>
        <p class="hint">每組最多 10 人。</p>
        <div id="groups"></div>

        <button id="confirmBtn" onclick="submitForm()" disabled>確認送出</button>
        <p id="message"></p>
    </div>

    <script>
        let selectedGroup = null;
        let hasSubmitted = false;

        function updateFields() {
            const count = parseInt(document.getElementById("groupSize").value);
            const extraMembersDiv = document.getElementById("extraMembers");
            extraMembersDiv.innerHTML = "";

            for (let i = 1; i < count; i++) {
                extraMembersDiv.innerHTML += `
                    <div class="member-card">
                        <h4>同行者 ${i}</h4>

                        <label>姓名</label>
                        <input type="text" class="extraName" placeholder="請輸入姓名">

                        <label>學號</label>
                        <input type="text" class="extraId" placeholder="請輸入學號">

                        <label>系所</label>
                        <input type="text" class="extraDept" placeholder="請輸入系所">
                    </div>
                `;
            }

            loadGroups();
        }

        async function loadGroups() {
            const res = await fetch("/groups");
            const groups = await res.json();
            const groupDiv = document.getElementById("groups");
            const requestedSize = parseInt(document.getElementById("groupSize").value);
            groupDiv.innerHTML = "";

            groups.forEach((group, index) => {
                const btn = document.createElement("button");
                const remaining = 10 - group.members.length;

                btn.innerText = `第 ${index + 1} 組 (${group.members.length}/10)`;
                btn.disabled = remaining < requestedSize;

                if (selectedGroup === index && !btn.disabled) {
                    btn.classList.add("selected");
                }

                btn.onclick = () => selectGroup(index);
                groupDiv.appendChild(btn);
            });

            if (
                selectedGroup !== null &&
                groups[selectedGroup] &&
                (10 - groups[selectedGroup].members.length) < requestedSize
            ) {
                selectedGroup = null;
                document.getElementById("confirmBtn").disabled = true;
            }
        }

        function selectGroup(index) {
            if (hasSubmitted) return;
            selectedGroup = index;
            document.getElementById("confirmBtn").disabled = false;
            loadGroups();
        }

        async function submitForm() {
            if (hasSubmitted) return;

            const name = document.getElementById("name").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const department = document.getElementById("department").value.trim();

            const extraNames = Array.from(document.querySelectorAll(".extraName")).map(input => input.value.trim());
            const extraIds = Array.from(document.querySelectorAll(".extraId")).map(input => input.value.trim());
            const extraDepts = Array.from(document.querySelectorAll(".extraDept")).map(input => input.value.trim());

            if (!name || !studentId || !department || extraNames.includes("") || extraIds.includes("") || extraDepts.includes("")) {
                document.getElementById("message").innerText = "⚠️ 請填寫所有姓名、學號、系所！";
                return;
            }

            if (selectedGroup === null) {
                document.getElementById("message").innerText = "⚠️ 請先選擇組別！";
                return;
            }

            const members = [{ name, studentId, department }];

            for (let i = 0; i < extraNames.length; i++) {
                members.push({
                    name: extraNames[i],
                    studentId: extraIds[i],
                    department: extraDepts[i]
                });
            }

            try {
                const res = await fetch("/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ groupIndex: selectedGroup, members })
                });

                const msg = await res.text();
                document.getElementById("message").innerText = msg;

                if (res.ok) {
                    hasSubmitted = true;
                    document.getElementById("confirmBtn").disabled = true;
                    document.querySelectorAll("input, select").forEach(el => el.disabled = true);
                } else {
                    document.getElementById("confirmBtn").disabled = false;
                }

                loadGroups();
            } catch (error) {
                document.getElementById("message").innerText = "⚠️ 發生錯誤，請稍後再試！";
            }
        }

                loadGroups();
            }
        }

        async function cancelRegistration() {
            if (!confirm("確定要取消這一整筆報名嗎？同一筆共同報名的所有成員都會被移除。")) return;
            const res = await fetch("/registration/cancel", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ studentId: managedStudentId })
            });
            document.getElementById("manageMessage").innerText = await res.text();
            if (res.ok) {
                document.getElementById("managePanel").style.display = "none";
                managedStudentId = "";
                loadGroups();
            }
        }

        loadGroups();
        setInterval(loadGroups, 5000);
    </script>
</body>
</html>
