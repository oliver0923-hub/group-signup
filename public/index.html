<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Group Sign-Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Course Group Sign-Up</h2>

        <h3>Student Information</h3>

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="Enter your student ID">

        <label for="department">Department / Program</label>
        <input type="text" id="department" placeholder="Enter your department or program">

        <label for="groupSize">Number of students signing up together (maximum 4)</label>
        <select id="groupSize" onchange="updateFields()">
            <option value="1">1 student</option>
            <option value="2">2 students</option>
            <option value="3">3 students</option>
            <option value="4">4 students</option>
        </select>

        <div id="extraMembers"></div>

        <h3>Select a Group</h3>
        <p class="hint">Each group can have up to 4 students.</p>
        <div id="groups"></div>

        <button id="confirmBtn" onclick="submitForm()" disabled>Submit</button>
        <p id="message"></p>
    </div>

    <script>
        let selectedGroup = null;
        let hasSubmitted = false;

        function updateFields() {
            const count = parseInt(document.getElementById("groupSize").value);
            const extraMembersDiv = document.getElementById("extraMembers");
            extraMembersDiv.innerHTML = "";

            for (let i = 1; i < count; i++) {
                extraMembersDiv.innerHTML += `
                    <div class="member-card">
                        <h4>Additional Student ${i}</h4>

                        <label>Name</label>
                        <input type="text" class="extraName" placeholder="Enter name">

                        <label>Student ID</label>
                        <input type="text" class="extraId" placeholder="Enter student ID">

                        <label>Department / Program</label>
                        <input type="text" class="extraDept" placeholder="Enter department or program">
                    </div>
                `;
            }

            loadGroups();
        }

        async function loadGroups() {
            const res = await fetch("/groups");
            const groups = await res.json();
            const groupDiv = document.getElementById("groups");
            const requestedSize = parseInt(document.getElementById("groupSize").value);
            groupDiv.innerHTML = "";

            groups.forEach((group, index) => {
                const btn = document.createElement("button");
                const remaining = 4 - group.members.length;

                btn.innerText = `Group ${index + 1} (${group.members.length}/4)`;
                btn.disabled = remaining < requestedSize;

                if (selectedGroup === index && !btn.disabled) {
                    btn.classList.add("selected");
                }

                btn.onclick = () => selectGroup(index);
                groupDiv.appendChild(btn);
            });

            if (
                selectedGroup !== null &&
                groups[selectedGroup] &&
                (4 - groups[selectedGroup].members.length) < requestedSize
            ) {
                selectedGroup = null;
                document.getElementById("confirmBtn").disabled = true;
            }
        }

        function selectGroup(index) {
            if (hasSubmitted) return;
            selectedGroup = index;
            document.getElementById("confirmBtn").disabled = false;
            loadGroups();
        }

        async function submitForm() {
            if (hasSubmitted) return;

            const name = document.getElementById("name").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const department = document.getElementById("department").value.trim();

            const extraNames = Array.from(document.querySelectorAll(".extraName")).map(input => input.value.trim());
            const extraIds = Array.from(document.querySelectorAll(".extraId")).map(input => input.value.trim());
            const extraDepts = Array.from(document.querySelectorAll(".extraDept")).map(input => input.value.trim());

            if (!name || !studentId || !department || extraNames.includes("") || extraIds.includes("") || extraDepts.includes("")) {
                document.getElementById("message").innerText = "Please complete all student information.";
                return;
            }

            if (selectedGroup === null) {
                document.getElementById("message").innerText = "Please select a group.";
                return;
            }

            const members = [{ name, studentId, department }];

            for (let i = 0; i < extraNames.length; i++) {
                members.push({
                    name: extraNames[i],
                    studentId: extraIds[i],
                    department: extraDepts[i]
                });
            }

            try {
                const res = await fetch("/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ groupIndex: selectedGroup, members })
                });

                const msg = await res.text();
                document.getElementById("message").innerText = msg;

                if (res.ok) {
                    hasSubmitted = true;
                    document.getElementById("confirmBtn").disabled = true;
                    document.querySelectorAll("input, select").forEach(el => el.disabled = true);
                } else {
                    document.getElementById("confirmBtn").disabled = false;
                }

                loadGroups();
            } catch (error) {
                document.getElementById("message").innerText = "Something went wrong. Please try again.";
            }
        }

                loadGroups();
            }
        }

        async function cancelRegistration() {
            if (!confirm("Cancel this entire registration? All students in the shared registration will be removed.")) return;
            const res = await fetch("/registration/cancel", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ studentId: managedStudentId })
            });
            document.getElementById("manageMessage").innerText = await res.text();
            if (res.ok) {
                document.getElementById("managePanel").style.display = "none";
                managedStudentId = "";
                loadGroups();
            }
        }

        loadGroups();
        setInterval(loadGroups, 5000);
    </script>
</body>
</html>
