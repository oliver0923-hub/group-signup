<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分組管理頁面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>分組管理頁面</h2>
        <p><a href="/export.csv"><button type="button">下載 CSV 名單</button></a></p>
        <div id="groupStatus"></div>
    </div>

    <script>
        async function updateGroups() {
            const res = await fetch("/groups");
            const groups = await res.json();
            const groupDiv = document.getElementById("groupStatus");
            groupDiv.innerHTML = "";

            groups.forEach((group, index) => {
                let groupInfo = `
                    <div class="admin-group">
                        <h3>第 ${index + 1} 組 (${group.members.length}/10)</h3>
                `;

                if (group.members.length === 0) {
                    groupInfo += "<p>目前尚無學生。</p>";
                }

                group.members.forEach(member => {
                    groupInfo += `
                        <p>
                            ${member.name} — ${member.department} — ${member.studentId}
                            <button class="remove-btn" onclick="removeStudent(${index}, '${member.studentId}')">移除</button>
                        </p>
                    `;
                });

                groupInfo += "</div>";
                groupDiv.innerHTML += groupInfo;
            });
        }

        async function removeStudent(groupIndex, studentId) {
            if (!confirm(`確定要移除學號 ${studentId} 嗎？`)) return;
            const res = await fetch("/remove", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ groupIndex, studentId })
            });
            const msg = await res.text();
            if (!res.ok) alert(msg);
            updateGroups();
        }

        setInterval(updateGroups, 3000);
        updateGroups();
    </script>
</body>
</html>
