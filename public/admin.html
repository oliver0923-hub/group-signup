<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Sign-Up Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Group Sign-Up Admin</h2>

        <div id="loginPanel" class="member-card">
            <h3>Admin Login</h3>
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="Enter admin password">
            <button type="button" onclick="login()">Login</button>
            <p id="loginMessage"></p>
        </div>

        <div id="adminPanel" style="display:none;">
            <p>
                <button type="button" onclick="downloadCsv()">Download CSV</button>
                <button type="button" onclick="logout()">Logout</button>
            </p>
            <div id="groupStatus"></div>
        </div>
    </div>

    <script>
        async function login() {
            const password = document.getElementById("adminPassword").value;
            const res = await fetch("/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });

            const msg = await res.text();
            document.getElementById("loginMessage").innerText = msg;

            if (res.ok) {
                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                updateGroups();
            }
        }

        async function checkSession() {
            const res = await fetch("/admin/groups");
            if (res.ok) {
                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                renderGroups(await res.json());
            }
        }

        async function updateGroups() {
            const res = await fetch("/admin/groups");
            if (res.status === 401) {
                document.getElementById("adminPanel").style.display = "none";
                document.getElementById("loginPanel").style.display = "block";
                return;
            }
            if (!res.ok) return;
            renderGroups(await res.json());
        }

        function renderGroups(groups) {
            const groupDiv = document.getElementById("groupStatus");
            groupDiv.innerHTML = "";

            groups.forEach((group, index) => {
                let groupInfo = `
                    <div class="admin-group">
                        <h3>Group  ${index + 1} (${group.members.length}/4)</h3>
                `;

                if (group.members.length === 0) {
                    groupInfo += "<p>No students yet.</p>";
                }

                group.members.forEach(member => {
                    groupInfo += `
                        <p>
                            ${member.name} — ${member.department} — ${member.studentId}
                            <button class="remove-btn" onclick="removeStudent(${index}, '${member.studentId}')">Remove</button>
                        </p>
                    `;
                });

                groupInfo += "</div>";
                groupDiv.innerHTML += groupInfo;
            });
        }

        async function removeStudent(groupIndex, studentId) {
            if (!confirm(`Remove student ${studentId}?`)) return;

            const res = await fetch("/remove", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ groupIndex, studentId })
            });

            if (res.status === 401) {
                document.getElementById("adminPanel").style.display = "none";
                document.getElementById("loginPanel").style.display = "block";
                return;
            }

            const msg = await res.text();
            if (!res.ok) alert(msg);
            updateGroups();
        }

        async function downloadCsv() {
            const res = await fetch("/export.csv");
            if (res.status === 401) {
                document.getElementById("adminPanel").style.display = "none";
                document.getElementById("loginPanel").style.display = "block";
                return;
            }
            if (!res.ok) return;

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "group-signup.csv";
            a.click();
            URL.revokeObjectURL(url);
        }

        async function logout() {
            await fetch("/admin/logout", { method: "POST" });
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("loginPanel").style.display = "block";
            document.getElementById("adminPassword").value = "";
            document.getElementById("loginMessage").innerText = "";
        }

        checkSession();
        setInterval(() => {
            if (document.getElementById("adminPanel").style.display !== "none") updateGroups();
        }, 3000);
    </script>
</body>
</html>
